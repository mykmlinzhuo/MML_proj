mark: ""

model_path: "/cephfs/shared/linzhuo/multimodal/FreeCustom/sd_v1.5"

gpu: 0

# feature injection setting
start_step: 0
end_step: 50
layer_idx: [14,15]

# set seeds
seeds: [2]

# set reference image infos
ref_image_infos: {
  dataset/freecustom/multi_concept/dog_necklace_sunglasses_1/image/dog.jpg: a dog,
  dataset/freecustom/multi_concept/dog_necklace_sunglasses_1/image/necklace.jpg: a man wearing a cross necklace,
  dataset/freecustom/multi_concept/dog_necklace_sunglasses_1/image/sunglasses.jpg: a woman wearing sunglasses,
}
target_prompt: " Minecraft a dog"

# ref image setting
use_null_ref_prompts: False     # Whether or not to use an empty prompt when denoising reference images.
mask_weights: [0.6, 0.6, 0.6]        # The larger the mask_weight is, the higher attention is for the reference image.

negative_prompt: "lowres, bad anatomy, text, error, cropped, worst quality, low quality, normal quality, jpeg artifacts, blurry"
style_fidelity: 0.5 # The larger the style_fidelity, the more like the reference concepts, range of values: [0,1]